<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="auto" fill="none">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="mainG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2048" />
      <stop offset="35%" stop-color="#121212" />
      <stop offset="100%" stop-color="#121212" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ed760" />
      <stop offset="100%" stop-color="#1db954" />
    </linearGradient>
    <linearGradient id="cardG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450af5" />
      <stop offset="100%" stop-color="#c4efd9" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Canvas Outer Background -->
  <rect width="1200" height="640" rx="16" fill="url(#bgG)"/>

  <!-- Desktop App Shell Container -->
  <g transform="translate(24, 20)" filter="url(#shadow)">
    <!-- App Background Border -->
    <rect width="1152" height="600" rx="12" fill="#000000" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Left Sidebar (Width: 260) -->
    <g transform="translate(8, 8)">
      <!-- Nav Card -->
      <rect width="250" height="112" rx="8" fill="#181818"/>
      <!-- Brand Logo -->
      <circle cx="32" cy="28" r="14" fill="url(#greenG)"/>
      <path d="M26 25 C29 23, 35 23, 38 25" stroke="#000" stroke-width="2" stroke-linecap="round"/>
      <path d="M28 29 C30 27, 34 27, 36 29" stroke="#000" stroke-width="2" stroke-linecap="round"/>
      <text x="54" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="800" fill="#ffffff">Librify</text>

      <!-- Início -->
      <circle cx="32" cy="64" r="5" fill="#ffffff"/>
      <text x="50" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Início</text>

      <!-- Buscar -->
      <circle cx="32" cy="94" r="5" stroke="#b3b3b3" stroke-width="2" fill="none"/>
      <text x="50" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#b3b3b3">Buscar</text>

      <!-- Library Box -->
      <g transform="translate(0, 120)">
        <rect width="250" height="384" rx="8" fill="#181818"/>
        <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#b3b3b3">Sua Biblioteca</text>
        <circle cx="225" cy="28" r="8" fill="rgba(255,255,255,0.06)"/>
        <text x="221" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#fff">+</text>

        <!-- Library Items -->
        <!-- Músicas Curtidas -->
        <rect x="12" y="52" width="226" height="52" rx="6" fill="#242424"/>
        <rect x="18" y="58" width="40" height="40" rx="4" fill="url(#cardG)"/>
        <path d="M38 74 l-5 -5 a3.5 3.5 0 0 1 5 -5 a3.5 3.5 0 0 1 5 5 z" fill="#fff" transform="scale(0.8) translate(8, 12)"/>
        <text x="68" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Músicas Curtidas</text>
        <text x="68" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#1ed760">📌 Playlist • 14 faixas</text>

        <!-- Playlist 2 -->
        <rect x="18" y="118" width="40" height="40" rx="4" fill="#ff5500"/>
        <text x="68" y="135" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#ffffff">Neon Odyssey</text>
        <text x="68" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#888">Playlist • Daft Punk</text>

        <!-- Playlist 3 -->
        <rect x="18" y="174" width="40" height="40" rx="4" fill="#0088ff"/>
        <text x="68" y="191" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#ffffff">Cyberpunk &amp; Synth</text>
        <text x="68" y="206" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#888">Playlist • The Weeknd</text>
      </g>
    </g>

    <!-- Center/Main Area -->
    <g transform="translate(266, 8)">
      <rect width="878" height="504" rx="8" fill="url(#mainG)"/>

      <!-- Top Nav Header -->
      <g transform="translate(24, 16)">
        <circle cx="16" cy="16" r="14" fill="rgba(0,0,0,0.6)"/>
        <path d="M18 11 L13 16 L18 21" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        <circle cx="50" cy="16" r="14" fill="rgba(0,0,0,0.6)"/>
        <path d="M48 11 L53 16 L48 21" stroke="#fff" stroke-width="2" stroke-linecap="round"/>

        <rect x="80" y="2" width="280" height="30" rx="15" fill="#242424" stroke="rgba(255,255,255,0.1)"/>
        <circle cx="96" cy="17" r="4" stroke="#888" stroke-width="1.5" fill="none"/>
        <text x="110" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#888">Buscar em 100M+ músicas do YouTube...</text>

        <!-- User profile icon -->
        <circle cx="810" cy="16" r="14" fill="#242424" stroke="rgba(255,255,255,0.1)"/>
        <circle cx="810" cy="13" r="4.5" fill="#fff"/>
        <path d="M802 24 C802 20, 818 20, 818 24" fill="#fff"/>
      </g>

      <!-- Main Content Header -->
      <text x="32" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#ffffff">Boa tarde</text>

      <!-- 6 Quick Cards -->
      <g transform="translate(32, 108)">
        <!-- Card 1 -->
        <rect width="256" height="52" rx="4" fill="rgba(255,255,255,0.08)"/>
        <rect width="52" height="52" rx="4" fill="url(#cardG)"/>
        <text x="64" y="31" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Músicas Curtidas</text>
        <circle cx="230" cy="26" r="16" fill="url(#greenG)"/>
        <polygon points="227,20 227,32 236,26" fill="#000"/>

        <!-- Card 2 -->
        <g transform="translate(272, 0)">
          <rect width="256" height="52" rx="4" fill="rgba(255,255,255,0.08)"/>
          <rect width="52" height="52" rx="4" fill="#e91429"/>
          <text x="64" y="31" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Today's Top Hits</text>
        </g>

        <!-- Card 3 -->
        <g transform="translate(544, 0)">
          <rect width="256" height="52" rx="4" fill="rgba(255,255,255,0.08)"/>
          <rect width="52" height="52" rx="4" fill="#1e3264"/>
          <text x="64" y="31" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Top Global 2024 (YouTube)</text>
        </g>
      </g>

      <!-- Section: Feito para Você -->
      <text x="32" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#ffffff">Feito para você</text>

      <!-- 4 Cards Grid -->
      <g transform="translate(32, 218)">
        <!-- Album Card 1 -->
        <rect width="186" height="240" rx="8" fill="#181818"/>
        <rect x="14" y="14" width="158" height="158" rx="6" fill="#3d2a70"/>
        <circle cx="140" cy="140" r="22" fill="url(#greenG)"/>
        <polygon points="137,132 137,148 148,140" fill="#000"/>
        <text x="14" y="196" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Neon Odyssey</text>
        <text x="14" y="214" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#888">Daft Punk • Álbum 2024</text>

        <!-- Album Card 2 -->
        <g transform="translate(206, 0)">
          <rect width="186" height="240" rx="8" fill="#181818"/>
          <rect x="14" y="14" width="158" height="158" rx="6" fill="#1a3b3a"/>
          <text x="14" y="196" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff">After Hours Twilight</text>
          <text x="14" y="214" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#888">The Weeknd • R&amp;B</text>
        </g>

        <!-- Album Card 3 -->
        <g transform="translate(412, 0)">
          <rect width="186" height="240" rx="8" fill="#181818"/>
          <rect x="14" y="14" width="158" height="158" rx="6" fill="#4d2211"/>
          <text x="14" y="196" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Demon Days 2099</text>
          <text x="14" y="214" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#888">Gorillaz • Virtual Band</text>
        </g>

        <!-- Album Card 4 (YouTube Direct) -->
        <g transform="translate(618, 0)">
          <rect width="186" height="240" rx="8" fill="#181818"/>
          <rect x="14" y="14" width="158" height="158" rx="6" fill="#590f1e"/>
          <text x="14" y="196" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Synthwave Radio</text>
          <text x="14" y="214" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#888">Live Stream • YouTube</text>
        </g>
      </g>
    </g>

    <!-- Bottom Fixed Player Bar (Height: 80) -->
    <g transform="translate(0, 520)">
      <rect width="1152" height="80" rx="0" fill="#000000" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

      <!-- Left: Track Details -->
      <g transform="translate(16, 12)">
        <rect width="56" height="56" rx="4" fill="#3d2a70"/>
        <text x="68" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Midnight City Groove</text>
        <text x="68" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#b3b3b3">Daft Punk • Neon Odyssey</text>
        <!-- Heart (Liked) -->
        <path d="M250 25 l-4 -4 a3 3 0 0 1 4 -4 a3 3 0 0 1 4 4 z" fill="#1ed760" transform="scale(1.3) translate(-36, -5)"/>
      </g>

      <!-- Center: Controls and Seek Bar -->
      <g transform="translate(380, 10)">
        <!-- Control buttons -->
        <!-- Shuffle -->
        <path d="M80 14 L92 22 M80 22 L92 14" stroke="#1ed760" stroke-width="1.8" stroke-linecap="round"/>
        <!-- Prev -->
        <polygon points="126,12 118,17 126,22" fill="#b3b3b3"/>
        <line x1="116" y1="12" x2="116" y2="22" stroke="#b3b3b3" stroke-width="2"/>
        <!-- Play/Pause -->
        <circle cx="150" cy="17" r="16" fill="#ffffff"/>
        <rect x="145" y="11" width="3" height="12" rx="1" fill="#000000"/>
        <rect x="152" y="11" width="3" height="12" rx="1" fill="#000000"/>
        <!-- Next -->
        <polygon points="174,12 182,17 174,22" fill="#b3b3b3"/>
        <line x1="184" y1="12" x2="184" y2="22" stroke="#b3b3b3" stroke-width="2"/>
        <!-- Repeat -->
        <path d="M208 12 A6 6 0 1 1 204 22" stroke="#b3b3b3" stroke-width="1.8" fill="none"/>

        <!-- Progress Scrubber -->
        <text x="0" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#a7a7a7">1:42</text>
        <rect x="30" y="43" width="340" height="4" rx="2" fill="rgba(255,255,255,0.2)"/>
        <rect x="30" y="43" width="168" height="4" rx="2" fill="url(#greenG)"/>
        <circle cx="198" cy="45" r="5" fill="#ffffff"/>
        <text x="378" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#a7a7a7">3:44</text>
      </g>

      <!-- Right: Queue and Volume Controls -->
      <g transform="translate(940, 26)">
        <!-- Queue icon -->
        <rect x="0" y="2" width="16" height="2" fill="#1ed760"/>
        <rect x="0" y="7" width="16" height="2" fill="#1ed760"/>
        <rect x="0" y="12" width="12" height="2" fill="#1ed760"/>

        <!-- Speaker -->
        <path d="M40 9 L44 5 L44 19 L40 15 L34 15 L34 9 Z" fill="#b3b3b3"/>
        <path d="M47 8 A6 6 0 0 1 47 16" stroke="#b3b3b3" stroke-width="1.5" fill="none"/>

        <!-- Volume Slider -->
        <rect x="58" y="9" width="100" height="4" rx="2" fill="rgba(255,255,255,0.2)"/>
        <rect x="58" y="9" width="76" height="4" rx="2" fill="#ffffff"/>
        <circle cx="134" cy="11" r="4.5" fill="#ffffff"/>
      </g>
    </g>
  </g>
</svg>
