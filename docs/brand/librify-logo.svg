<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <!-- Glow effect -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ed760" />
      <stop offset="100%" stop-color="#1db954" />
    </linearGradient>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(10, 10)">
    <circle cx="40" cy="40" r="38" fill="url(#brandGrad)" filter="url(#glow)"/>
    <circle cx="40" cy="40" r="36" fill="url(#brandGrad)"/>
    <!-- Dynamic soundwaves / notes -->
    <path d="M26 32 C34 26, 46 26, 54 32" stroke="#000" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M29 42 C36 38, 44 38, 51 42" stroke="#000" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M33 52 C37 49, 43 49, 47 52" stroke="#000" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Text Librify -->
  <text x="110" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
    Librify
  </text>
  <circle cx="316" cy="30" r="6" fill="#1ed760"/>
</svg>
